<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Spider-Man: Web Sandbox Engine v3.0</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Three.js r128 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  
  <style>
    :root {
      --vh: 1vh;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #030712;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    #game-container, #ui-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      height: calc(var(--vh, 1vh) * 100);
    }

    #ui-overlay {
      pointer-events: none;
      z-index: 10;
    }

    .interactive {
      pointer-events: auto;
    }

    /* Mobile Bottom Safety Constraints */
    #joystick-container {
      position: absolute;
      left: max(1.25rem, env(safe-area-inset-left));
      bottom: calc(1.25rem + env(safe-area-inset-bottom, 0px));
    }

    #touch-actions-container {
      position: absolute;
      right: max(1.25rem, env(safe-area-inset-right));
      bottom: calc(1.25rem + env(safe-area-inset-bottom, 0px));
    }

    /* Target Reticle Pulsing */
    @keyframes reticlePulse {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
      50% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
    }

    .reticle-active {
      animation: reticlePulse 1.2s infinite ease-in-out;
    }

    /* Glassmorphism Styling */
    .glass-panel {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
  </style>
</head>
<body class="bg-gray-950 text-white overflow-hidden">

  <!-- 3D Canvas Rendering Container -->
  <div id="game-container"></div>

  <!-- Game HUD Overlay -->
  <div id="ui-overlay" class="flex flex-col justify-between p-4 sm:p-6">
    
    <!-- Top Navigation & Stats Bar -->
    <div class="flex justify-between items-start w-full">
      <!-- Velocity & Player Stats -->
      <div class="glass-panel rounded-2xl p-3 sm:p-4 flex items-center gap-4 border-l-4 border-red-600 shadow-2xl">
        <div class="flex flex-col">
          <span class="text-[10px] sm:text-xs font-bold uppercase tracking-wider text-gray-400">Velocity</span>
          <div class="flex items-baseline gap-1">
            <span id="speed-display" class="text-2xl sm:text-4xl font-extrabold text-red-500 tracking-tight">0</span>
            <span class="text-xs font-semibold text-gray-400">MPH</span>
          </div>
        </div>
        <div class="h-8 w-px bg-gray-700/60"></div>
        <div class="flex flex-col">
          <span class="text-[10px] sm:text-xs font-bold uppercase tracking-wider text-gray-400">Suit Sync</span>
          <div class="w-20 sm:w-28 bg-gray-800 rounded-full h-2.5 mt-1 overflow-hidden border border-gray-700">
            <div id="suit-integrity" class="bg-gradient-to-r from-red-600 to-red-400 h-full rounded-full transition-all duration-300" style="width: 100%"></div>
          </div>
        </div>
      </div>

      <!-- Minimap & Suit Selector Trigger -->
      <div class="flex items-start gap-3">
        <button id="btn-suit-menu" class="interactive glass-panel hover:bg-slate-800/80 active:scale-95 text-white p-3 rounded-2xl transition flex items-center gap-2 border border-red-500/30">
          <i class="fa-solid font-sharp fa-shirt text-red-500 text-lg"></i>
          <span class="hidden sm:inline text-xs font-bold tracking-wider uppercase">Armory</span>
        </button>
        
        <!-- Canvas Minimap -->
        <div class="glass-panel p-1.5 rounded-2xl border border-gray-700/50 shadow-xl">
          <canvas id="minimap" width="90" height="90" class="rounded-xl bg-gray-900/90"></canvas>
        </div>
      </div>
    </div>

    <!-- Center Reticle Indicator -->
    <div id="target-reticle" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none transition-all duration-150 opacity-0">
      <div class="w-10 h-10 border-2 border-red-500/80 rounded-full flex items-center justify-center relative">
        <div class="w-2 h-2 bg-red-500 rounded-full"></div>
        <div class="absolute -top-1 w-0.5 h-2 bg-red-500"></div>
        <div class="absolute -bottom-1 w-0.5 h-2 bg-red-500"></div>
        <div class="absolute -left-1 h-0.5 w-2 bg-red-500"></div>
        <div class="absolute -right-1 h-0.5 w-2 bg-red-500"></div>
      </div>
      <span id="target-dist" class="absolute top-12 left-1/2 -translate-x-1/2 text-[10px] font-mono bg-black/70 px-1.5 py-0.5 rounded text-red-400 border border-red-900/40">0m</span>
    </div>

    <!-- Dynamic Target Alert Banner -->
    <div id="combo-alert" class="self-center glass-panel px-4 py-2 rounded-full border border-red-500/40 text-red-400 text-xs font-bold uppercase tracking-widest opacity-0 transition-all transform translate-y-2">
      Web Zip Engaged
    </div>

    <!-- Mobile Touch Controls Layer -->
    <div class="w-full relative h-36 sm:h-44">
      <!-- Left: Dynamic Touch Joystick -->
      <div id="joystick-container" class="interactive w-28 h-28 sm:w-36 sm:h-36 rounded-full glass-panel border border-white/10 flex items-center justify-center touch-none">
        <div id="joystick-base" class="w-full h-full rounded-full relative flex items-center justify-center">
          <div id="joystick-thumb" class="w-10 h-10 sm:w-12 sm:h-12 bg-gradient-to-br from-red-500 to-red-700 rounded-full shadow-lg border border-white/30 absolute transition-transform duration-75"></div>
        </div>
      </div>

      <!-- Right: Action Buttons Group -->
      <div id="touch-actions-container" class="interactive flex items-center gap-3 touch-none">
        <!-- Zip Button -->
        <button id="btn-zip" class="w-12 h-12 sm:w-14 sm:h-14 rounded-full glass-panel bg-slate-800/80 active:bg-red-600/80 active:scale-90 text-white flex items-center justify-center border border-white/20 shadow-lg transition">
          <i class="fa-solid fa-bolt text-amber-400 text-base sm:text-lg"></i>
        </button>

        <!-- Catapult / Jump Button -->
        <button id="btn-launch" class="w-12 h-12 sm:w-14 sm:h-14 rounded-full glass-panel bg-slate-800/80 active:bg-red-600/80 active:scale-90 text-white flex items-center justify-center border border-white/20 shadow-lg transition">
          <i class="fa-solid fa-angles-up text-cyan-400 text-base sm:text-lg"></i>
        </button>

        <!-- Primary Swing Button -->
        <button id="btn-swing" class="w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-gradient-to-br from-red-600 to-red-800 active:from-red-500 active:to-red-700 active:scale-95 text-white flex items-center justify-center border-2 border-red-400/50 shadow-2xl shadow-red-900/50">
          <i class="fa-solid fa-spider text-2xl sm:text-3xl"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Suit Armory Selection Modal -->
  <div id="suit-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
    <div class="glass-panel max-w-md w-full rounded-3xl p-6 border border-red-500/30 flex flex-col gap-5 shadow-2xl">
      <div class="flex justify-between items-center border-b border-gray-800 pb-3">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-mask text-red-500 text-xl"></i>
          <h2 class="text-xl font-black uppercase tracking-wider text-white">Suit Armory</h2>
        </div>
        <button id="btn-close-modal" class="text-gray-400 hover:text-white p-2 text-lg">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="grid grid-cols-2 gap-3" id="suit-grid">
        <!-- Suit Option 1 -->
        <button data-suit="classic" class="suit-card active glass-panel p-4 rounded-2xl border-2 border-red-500 flex flex-col items-center gap-2 hover:bg-red-900/20 transition text-center">
          <div class="w-10 h-10 rounded-full bg-gradient-to-br from-red-600 to-blue-700 flex items-center justify-center shadow">
            <i class="fa-solid fa-shield-halved text-white"></i>
          </div>
          <span class="text-xs font-bold uppercase tracking-wider">Classic Red</span>
        </button>

        <!-- Suit Option 2 -->
        <button data-suit="stealth" class="suit-card glass-panel p-4 rounded-2xl border-2 border-transparent flex flex-col items-center gap-2 hover:bg-cyan-900/20 transition text-center">
          <div class="w-10 h-10 rounded-full bg-gradient-to-br from-gray-900 to-cyan-500 flex items-center justify-center shadow">
            <i class="fa-solid fa-eye text-cyan-300"></i>
          </div>
          <span class="text-xs font-bold uppercase tracking-wider">Stealth Cyber</span>
        </button>

        <!-- Suit Option 3 -->
        <button data-suit="iron" class="suit-card glass-panel p-4 rounded-2xl border-2 border-transparent flex flex-col items-center gap-2 hover:bg-amber-900/20 transition text-center">
          <div class="w-10 h-10 rounded-full bg-gradient-to-br from-red-800 to-amber-400 flex items-center justify-center shadow">
            <i class="fa-solid fa-atom text-amber-200"></i>
          </div>
          <span class="text-xs font-bold uppercase tracking-wider">Iron Spider</span>
        </button>

        <!-- Suit Option 4 -->
        <button data-suit="symbiote" class="suit-card glass-panel p-4 rounded-2xl border-2 border-transparent flex flex-col items-center gap-2 hover:bg-purple-900/20 transition text-center">
          <div class="w-10 h-10 rounded-full bg-gradient-to-br from-gray-950 to-slate-800 border border-white/20 flex items-center justify-center shadow">
            <i class="fa-solid fa-ghost text-white"></i>
          </div>
          <span class="text-xs font-bold uppercase tracking-wider">Symbiote Dark</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Game Logic Script -->
  <script>
    /* =========================================================================
       1. DYNAMIC VIEWPORT & SAFE AREA ADAPTATION
       ========================================================================= */
    function updateCustomViewportHeight() {
      const vh = window.innerHeight * 0.01;
      document.documentElement.style.setProperty('--vh', `${vh}px`);
    }
    updateCustomViewportHeight();
    window.addEventListener('resize', updateCustomViewportHeight);
    window.addEventListener('orientationchange', updateCustomViewportHeight);

    /* =========================================================================
       2. SYNTHETIC AUDIO ENGINE (Web Audio API)
       ========================================================================= */
    class SoundEngine {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playThwip() {
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(800, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(120, this.ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.12);
      }
      playZip() {
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(1200, this.ctx.currentTime + 0.18);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.18);
      }
      playRelease() {
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(150, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.08);
      }
    }
    const soundSynth = new SoundEngine();

    /* =========================================================================
       3. THREE.JS SCENE SETUP & PROCEDURAL WORLD SETUP
       ========================================================================= */
    const container = document.getElementById('game-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0f1d);
    scene.fog = new THREE.FogExp2(0x0a0f1d, 0.008);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xdde6ff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffeedd, 1.2);
    dirLight.position.set(120, 200, 80);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.camera.near = 10;
    dirLight.shadow.camera.far = 400;
    const d = 150;
    dirLight.shadow.camera.left = -d;
    dirLight.shadow.camera.right = d;
    dirLight.shadow.camera.top = d;
    dirLight.shadow.camera.bottom = -d;
    scene.add(dirLight);

    /* Procedural Textures */
    function createBuildingTexture() {
      const cv = document.createElement('canvas');
      cv.width = 128; cv.height = 256;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#111827';
      ctx.fillRect(0, 0, 128, 256);
      ctx.fillStyle = '#fef08a';
      for (let y = 10; y < 246; y += 16) {
        for (let x = 10; x < 118; x += 16) {
          if (Math.random() > 0.45) {
            ctx.globalAlpha = Math.random() * 0.7 + 0.3;
            ctx.fillRect(x, y, 8, 10);
          }
        }
      }
      return new THREE.CanvasTexture(cv);
    }

    function createRoadTexture() {
      const cv = document.createElement('canvas');
      cv.width = 256; cv.height = 256;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#1f2937';
      ctx.fillRect(0, 0, 256, 256);
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 4;
      ctx.setLineDash([16, 16]);
      ctx.beginPath();
      ctx.moveTo(128, 0); ctx.lineTo(128, 256);
      ctx.stroke();
      return new THREE.CanvasTexture(cv);
    }

    const bldgTexture = createBuildingTexture();
    bldgTexture.wrapS = THREE.RepeatWrapping;
    bldgTexture.wrapT = THREE.RepeatWrapping;
    bldgTexture.repeat.set(1, 4);

    const roadTexture = createRoadTexture();
    roadTexture.wrapS = THREE.RepeatWrapping;
    roadTexture.wrapT = THREE.RepeatWrapping;

    /* City Generation (11x11 Grid) */
    const cityGridSize = 11;
    const blockSize = 30;
    const roadWidth = 14;
    const step = blockSize + roadWidth;
    const cityOffset = (cityGridSize * step) / 2;
    const buildingMeshes = [];

    // Ground Base
    const groundGeo = new THREE.PlaneGeometry(600, 600);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.8 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const bldgMatBase = new THREE.MeshStandardMaterial({
      map: bldgTexture,
      roughness: 0.3,
      metalness: 0.2
    });

    for (let gx = 0; gx < cityGridSize; gx++) {
      for (let gz = 0; gz < cityGridSize; gz++) {
        const x = (gx * step) - cityOffset;
        const z = (gz * step) - cityOffset;

        // Roads
        const roadGeo = new THREE.PlaneGeometry(step, step);
        const roadMat = new THREE.MeshStandardMaterial({ map: roadTexture, roughness: 0.9 });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        road.position.set(x, 0.05, z);
        road.receiveShadow = true;
        scene.add(road);

        // Buildings
        const height = Math.floor(Math.random() * 70) + 35;
        const bldgGeo = new THREE.BoxGeometry(blockSize, height, blockSize);
        const bldg = new THREE.Mesh(bldgGeo, bldgMatBase);
        bldg.position.set(x, height / 2, z);
        bldg.castShadow = true;
        bldg.receiveShadow = true;
        scene.add(bldg);
        buildingMeshes.push(bldg);

        // Rooftop Props (Water towers / Antennas)
        if (Math.random() > 0.5) {
          const propGeo = new THREE.CylinderGeometry(2, 2, 6, 8);
          const propMat = new THREE.MeshStandardMaterial({ color: 0x475569 });
          const prop = new THREE.Mesh(propGeo, propMat);
          prop.position.set(x + (Math.random() * 8 - 4), height + 3, z + (Math.random() * 8 - 4));
          scene.add(prop);
        }
      }
    }

    /* =========================================================================
       4. PROCEDURAL SPIDER-MAN CHARACTER RIG & SUITS
       ========================================================================= */
    const suits = {
      classic: { primary: 0xd32f2f, secondary: 0x1976d2, glow: 0x000000, metalness: 0.1, roughness: 0.4 },
      stealth: { primary: 0x111827, secondary: 0x1f2937, glow: 0x00f3ff, metalness: 0.8, roughness: 0.2 },
      iron: { primary: 0x991b1b, secondary: 0xd97706, glow: 0x38bdf8, metalness: 0.9, roughness: 0.1 },
      symbiote: { primary: 0x030712, secondary: 0x111827, glow: 0xffffff, metalness: 0.3, roughness: 0.3 }
    };

    let currentSuit = 'classic';

    const playerGroup = new THREE.Group();
    scene.add(playerGroup);

    // Torso
    const torsoMat = new THREE.MeshStandardMaterial({ color: suits.classic.primary, roughness: 0.4 });
    const limbMat = new THREE.MeshStandardMaterial({ color: suits.classic.secondary, roughness: 0.4 });

    const torsoGeo = new THREE.BoxGeometry(0.9, 1.2, 0.5);
    const torso = new THREE.Mesh(torsoGeo, torsoMat);
    torso.position.y = 1.4;
    torso.castShadow = true;
    playerGroup.add(torso);

    // Head
    const headGeo = new THREE.SphereGeometry(0.35, 16, 16);
    const head = new THREE.Mesh(headGeo, torsoMat);
    head.position.y = 0.9;
    torso.add(head);

    // Eyes
    const eyeGeo = new THREE.BoxGeometry(0.12, 0.06, 0.05);
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
    eyeL.position.set(-0.12, 0.05, 0.32);
    eyeL.rotation.y = -0.2;
    const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
    eyeR.position.set(0.12, 0.05, 0.32);
    eyeR.rotation.y = 0.2;
    head.add(eyeL, eyeR);

    // Limbs Hierarchy
    const armL = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.9, 0.3), limbMat);
    armL.position.set(-0.65, 0.2, 0);
    const armR = armL.clone();
    armR.position.x = 0.65;
    torso.add(armL, armR);

    const legL = new THREE.Mesh(new THREE.BoxGeometry(0.35, 1.0, 0.35), limbMat);
    legL.position.set(-0.25, -1.0, 0);
    const legR = legL.clone();
    legR.position.x = 0.25;
    torso.add(legL, legR);

    // Dynamic Web Visual Line
    const webGeo = new THREE.BufferGeometry();
    const webPositions = new Float32Array(6); // 2 points (x,y,z)
    webGeo.setAttribute('position', new THREE.BufferAttribute(webPositions, 3));
    const webMat = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 3 });
    const webLine = new THREE.Line(webGeo, webMat);
    webLine.visible = false;
    scene.add(webLine);

    function setSuit(suitKey) {
      if (!suits[suitKey]) return;
      currentSuit = suitKey;
      const s = suits[suitKey];
      
      torsoMat.color.setHex(s.primary);
      torsoMat.metalness = s.metalness;
      torsoMat.roughness = s.roughness;

      limbMat.color.setHex(s.secondary);
      limbMat.metalness = s.metalness;
      limbMat.roughness = s.roughness;

      eyeMat.color.setHex(s.glow !== 0x000000 ? s.glow : 0xffffff);

      // Highlight Active UI
      document.querySelectorAll('.suit-card').forEach(card => {
        if (card.dataset.suit === suitKey) {
          card.classList.add('border-red-500', 'active');
          card.classList.remove('border-transparent');
        } else {
          card.classList.remove('border-red-500', 'active');
          card.classList.add('border-transparent');
        }
      });
    }

    /* =========================================================================
       5. PHYSICS & SWINGING ENGINE
       ========================================================================= */
    const player = {
      pos: new THREE.Vector3(0, 40, 0),
      vel: new THREE.Vector3(0, 0, 0),
      rotY: 0,
      isSwinging: false,
      anchorPoint: new THREE.Vector3(),
      ropeLength: 0,
      isGrounded: false,
      zipTarget: null,
      isZipping: false
    };

    const gravity = -28.0;
    const raycaster = new THREE.Raycaster();

    /* Target Reticle Calculation */
    let currentTargetPoint = null;

    function updateReticle() {
      const center = new THREE.Vector2(0, 0);
      raycaster.setFromCamera(center, camera);
      const intersects = raycaster.intersectObjects(buildingMeshes);

      const reticleEl = document.getElementById('target-reticle');
      const distEl = document.getElementById('target-dist');

      if (intersects.length > 0 && intersects[0].distance < 140) {
        currentTargetPoint = intersects[0].point;
        reticleEl.style.opacity = '1';
        reticleEl.classList.add('reticle-active');
        distEl.textContent = `${Math.round(intersects[0].distance)}m`;
      } else {
        // Fallback target straight ahead high up
        const forward = new THREE.Vector3();
        camera.getWorldDirection(forward);
        currentTargetPoint = player.pos.clone().add(forward.multiplyScalar(60)).add(new THREE.Vector3(0, 25, 0));
        reticleEl.style.opacity = '0.4';
        reticleEl.classList.remove('reticle-active');
        distEl.textContent = `AUTO`;
      }
    }

    function startSwing() {
      if (!currentTargetPoint) return;
      player.isSwinging = true;
      player.anchorPoint.copy(currentTargetPoint);
      player.ropeLength = player.pos.distanceTo(player.anchorPoint);
      soundSynth.playThwip();
      webLine.visible = true;

      // Initial momentum boost
      player.vel.y += 4;
      player.vel.add(new THREE.Vector3(Math.sin(player.rotY) * 6, 0, Math.cos(player.rotY) * 6));
    }

    function stopSwing() {
      if (player.isSwinging) {
        player.isSwinging = false;
        webLine.visible = false;
        soundSynth.playRelease();
        // Launch boost
        player.vel.multiplyScalar(1.25);
      }
    }

    function triggerZip() {
      if (!currentTargetPoint) return;
      player.isZipping = true;
      player.zipTarget = currentTargetPoint.clone();
      soundSynth.playZip();
      webLine.visible = true;
      
      showAlert("WEB ZIP!");

      setTimeout(() => {
        player.isZipping = false;
        webLine.visible = false;
      }, 350);
    }

    function triggerCatapult() {
      player.vel.y = 28;
      const fwd = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), player.rotY);
      player.vel.add(fwd.multiplyScalar(22));
      soundSynth.playZip();
      showAlert("CATAPULT LAUNCH!");
    }

    function showAlert(text) {
      const alertEl = document.getElementById('combo-alert');
      alertEl.textContent = text;
      alertEl.style.opacity = '1';
      alertEl.style.transform = 'translateY(0)';
      setTimeout(() => {
        alertEl.style.opacity = '0';
        alertEl.style.transform = 'translateY(8px)';
      }, 1200);
    }

    /* =========================================================================
       6. INPUT CONTROLLERS (Desktop & Mobile)
       ========================================================================= */
    const keys = {};
    const inputMove = { x: 0, y: 0 };

    // Keyboard
    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'Space' && !player.isSwinging) startSwing();
      if (e.code === 'KeyE') triggerZip();
      if (e.code === 'ShiftLeft') triggerCatapult();
    });

    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
      if (e.code === 'Space') stopSwing();
    });

    // Touch Joystick Engine
    const joystickContainer = document.getElementById('joystick-container');
    const joystickThumb = document.getElementById('joystick-thumb');
    let joystickActive = false;
    let touchOrigin = { x: 0, y: 0 };

    joystickContainer.addEventListener('touchstart', (e) => {
      joystickActive = true;
      const touch = e.touches[0];
      const rect = joystickContainer.getBoundingClientRect();
      touchOrigin = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (!joystickActive) return;
      const touch = e.touches[0];
      const dx = touch.clientX - touchOrigin.x;
      const dy = touch.clientY - touchOrigin.y;
      const dist = Math.min(Math.hypot(dx, dy), 45);
      const angle = Math.atan2(dy, dx);

      const moveX = Math.cos(angle) * dist;
      const moveY = Math.sin(angle) * dist;

      joystickThumb.style.transform = `translate(${moveX}px, ${moveY}px)`;
      inputMove.x = moveX / 45;
      inputMove.y = moveY / 45;
    }, { passive: true });

    const resetJoystick = () => {
      joystickActive = false;
      joystickThumb.style.transform = `translate(0px, 0px)`;
      inputMove.x = 0;
      inputMove.y = 0;
    };

    window.addEventListener('touchend', resetJoystick);
    window.addEventListener('touchcancel', resetJoystick);

    // Mobile Action Buttons
    const btnSwing = document.getElementById('btn-swing');
    btnSwing.addEventListener('touchstart', (e) => { e.preventDefault(); startSwing(); });
    btnSwing.addEventListener('touchend', (e) => { e.preventDefault(); stopSwing(); });

    document.getElementById('btn-zip').addEventListener('click', triggerZip);
    document.getElementById('btn-launch').addEventListener('click', triggerCatapult);

    // Camera Touch Rotation Controls
    let touchCamStart = { x: 0, y: 0 };
    let camYaw = 0;
    let camPitch = 0.2;

    window.addEventListener('touchstart', (e) => {
      if (e.target.closest('.interactive')) return;
      touchCamStart.x = e.touches[0].clientX;
      touchCamStart.y = e.touches[0].clientY;
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (e.target.closest('.interactive')) return;
      const dx = e.touches[0].clientX - touchCamStart.x;
      const dy = e.touches[0].clientY - touchCamStart.y;
      camYaw -= dx * 0.005;
      camPitch = Math.max(-0.4, Math.min(0.8, camPitch + dy * 0.005));
      touchCamStart.x = e.touches[0].clientX;
      touchCamStart.y = e.touches[0].clientY;
    }, { passive: true });

    /* Suit Armory Modal */
    const suitModal = document.getElementById('suit-modal');
    document.getElementById('btn-suit-menu').addEventListener('click', () => {
      suitModal.classList.remove('opacity-0', 'pointer-events-none');
    });
    document.getElementById('btn-close-modal').addEventListener('click', () => {
      suitModal.classList.add('opacity-0', 'pointer-events-none');
    });

    document.querySelectorAll('.suit-card').forEach(card => {
      card.addEventListener('click', () => {
        setSuit(card.dataset.suit);
        suitModal.classList.add('opacity-0', 'pointer-events-none');
      });
    });

    /* =========================================================================
       7. MAIN GAME LOOP & ANIMATION
       ========================================================================= */
    const clock = new THREE.Clock();
    const speedDisplay = document.getElementById('speed-display');
    const minimapCanvas = document.getElementById('minimap');
    const miniCtx = minimapCanvas.getContext('2d');

    function drawMinimap() {
      miniCtx.clearRect(0, 0, 90, 90);
      miniCtx.fillStyle = '#0f172a';
      miniCtx.fillRect(0, 0, 90, 90);

      // Render buildings relative to player
      miniCtx.fillStyle = '#334155';
      const scale = 0.25;
      const cx = 45;
      const cy = 45;

      buildingMeshes.forEach(b => {
        const dx = (b.position.x - player.pos.x) * scale;
        const dz = (b.position.z - player.pos.z) * scale;
        if (Math.abs(dx) < 40 && Math.abs(dz) < 40) {
          miniCtx.fillRect(cx + dx - 4, cy + dz - 4, 8, 8);
        }
      });

      // Player Arrow
      miniCtx.save();
      miniCtx.translate(cx, cy);
      miniCtx.rotate(-player.rotY);
      miniCtx.fillStyle = '#ef4444';
      miniCtx.beginPath();
      miniCtx.moveTo(0, -5);
      miniCtx.lineTo(4, 5);
      miniCtx.lineTo(-4, 5);
      miniCtx.closePath();
      miniCtx.fill();
      miniCtx.restore();
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.1);

      // --- Movement Inputs ---
      let moveDirZ = 0;
      let moveDirX = 0;

      if (keys['KeyW']) moveDirZ -= 1;
      if (keys['KeyS']) moveDirZ += 1;
      if (keys['KeyA']) moveDirX -= 1;
      if (keys['KeyD']) moveDirX += 1;

      if (joystickActive) {
        moveDirX = inputMove.x;
        moveDirZ = inputMove.y;
      }

      // Rotate player vector relative to camera angle
      if (Math.abs(moveDirX) > 0.1 || Math.abs(moveDirZ) > 0.1) {
        player.rotY = camYaw + Math.atan2(-moveDirX, -moveDirZ);
      }

      // --- Physics State Engine ---
      if (player.isZipping && player.zipTarget) {
        const dir = player.zipTarget.clone().sub(player.pos).normalize();
        player.vel.copy(dir.multiplyScalar(85));
      } else if (player.isSwinging) {
        // Pendulum constraint
        player.vel.y += gravity * dt;
        player.pos.addScaledVector(player.vel, dt);

        const toAnchor = player.pos.clone().sub(player.anchorPoint);
        const currentDist = toAnchor.length();

        if (currentDist > player.ropeLength) {
          toAnchor.normalize();
          // Tension force removes radial velocity outward
          const radialVel = player.vel.dot(toAnchor);
          if (radialVel > 0) {
            player.vel.sub(toAnchor.multiplyScalar(radialVel));
          }
          // Constrain position
          player.pos.copy(player.anchorPoint).add(toAnchor.multiplyScalar(player.ropeLength));
        }

        // Momentum Pump forward
        const fwd = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), player.rotY);
        player.vel.add(fwd.multiplyScalar(14 * dt));
      } else {
        // Free Fall / Grounded physics
        player.vel.y += gravity * dt;

        if (player.isGrounded) {
          player.vel.x *= 0.88;
          player.vel.z *= 0.88;
          const fwd = new THREE.Vector3(Math.sin(player.rotY), 0, Math.cos(player.rotY));
          if (Math.abs(moveDirX) > 0.1 || Math.abs(moveDirZ) > 0.1) {
            player.vel.add(fwd.multiplyScalar(25 * dt));
          }
        }

        player.pos.addScaledVector(player.vel, dt);
      }

      // --- Ground Collision ---
      if (player.pos.y <= 1.2) {
        player.pos.y = 1.2;
        player.vel.y = 0;
        player.isGrounded = true;
      } else {
        player.isGrounded = false;
      }

      // Update Player Mesh Position
      playerGroup.position.copy(player.pos);
      playerGroup.rotation.y = player.rotY;

      // Dynamic Procedural Animation Poses
      const speed = player.vel.length();
      speedDisplay.textContent = Math.round(speed * 1.8);

      if (player.isSwinging) {
        // Heroic swing pose
        torso.rotation.x = 0.6;
        armL.rotation.x = -2.8;
        armR.rotation.x = 0.4;
        legL.rotation.x = -0.8;
        legR.rotation.x = 0.5;
      } else if (!player.isGrounded) {
        // Skydiving pose
        torso.rotation.x = 0.2;
        armL.rotation.x = -1.2;
        armR.rotation.x = -1.2;
        legL.rotation.x = 0.4;
        legR.rotation.x = 0.4;
      } else if (speed > 2) {
        // Running animation
        const t = clock.getElapsedTime() * 12;
        torso.rotation.x = 0.2;
        armL.rotation.x = Math.sin(t) * 0.8;
        armR.rotation.x = -Math.sin(t) * 0.8;
        legL.rotation.x = -Math.sin(t) * 1.0;
        legR.rotation.x = Math.sin(t) * 1.0;
      } else {
        // Idle
        torso.rotation.x = 0;
        armL.rotation.x = 0;
        armR.rotation.x = 0;
        legL.rotation.x = 0;
        legR.rotation.x = 0;
      }

      // Update Web Visual Line Pos
      if (webLine.visible) {
        const handPos = player.pos.clone().add(new THREE.Vector3(0, 1.5, 0));
        const target = player.isSwinging ? player.anchorPoint : (player.zipTarget || handPos);
        
        const posAttr = webLine.geometry.attributes.position;
        posAttr.setXYZ(0, handPos.x, handPos.y, handPos.z);
        posAttr.setXYZ(1, target.x, target.y, target.z);
        posAttr.needsUpdate = true;
      }

      // --- Orbit Third-Person Camera ---
      const camDist = 12;
      const camX = player.pos.x + camDist * Math.sin(camYaw) * Math.cos(camPitch);
      const camY = player.pos.y + camDist * Math.sin(camPitch) + 2.5;
      const camZ = player.pos.z + camDist * Math.cos(camYaw) * Math.cos(camPitch);

      camera.position.set(camX, Math.max(camY, 1.5), camZ);
      camera.lookAt(player.pos.x, player.pos.y + 1.8, player.pos.z);

      // Raycast targeting overlay & minimap
      updateReticle();
      drawMinimap();

      renderer.render(scene, camera);
    }

    // Window Resize Handling
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Start Engine Loop
    animate();
  </script>
</body>
</html>
